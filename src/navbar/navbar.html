<!DOCTYPE html>
<!-- Fragmento reutilizable de navegación para las vistas administrativas. -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar | WorldCar</title>
  <link rel="stylesheet" href="../assets/styles/styles.css">
  <link rel="stylesheet" href="../assets/styles/navbar.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container d-flex align-items-center">
    <button class="navbar-toggler me-2 d-block" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation" style="display:block !important;">
      <span class="navbar-toggler-icon"></span>
    </button>
    <span class="navbar-brand mb-0 h1" style="font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight:700; letter-spacing:0.04em; color:#f8fafc; font-size:1.6rem;">WorldCar</span>
    <div class="collapse navbar-collapse justify-content-end" id="navbarMenu">
      <ul class="navbar-nav align-items-lg-center ms-auto mb-2 mb-lg-0">
        <!-- Acceso visual a las notificaciones del usuario. -->
        <li class="nav-item position-relative ms-lg-3">
          <a class="nav-link" href="#" title="Notificaciones">
            <span class="d-inline-block bg-primary rounded-circle" style="width:18px; height:18px; position:relative; top:3px; margin-right:4px;"></span>
            <span class="visually-hidden">Notificaciones</span>
          </a>
        </li>
        <!-- Menú de cuenta y acciones relacionadas con el usuario. -->
        <li class="nav-item dropdown ms-lg-3">
          <a class="nav-link dropdown-toggle d-flex flex-column align-items-center" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <img src="../assets/images/1-Lamborghini-Urus-SE-review-2024.jpg" alt="Usuario" class="rounded-circle mb-1" style="width:40px; height:40px; object-fit:cover; border:2px solid #6d8cff;">
            <span class="text-light" style="font-size:0.95rem;">Juan Pérez</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end text-center shadow" aria-labelledby="userDropdown">
            <li><a class="dropdown-item" href="#">Perfil</a></li>
            <li><a class="dropdown-item" href="#">Cambiar contraseña</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="#">Cerrar sesión</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
